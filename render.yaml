services:
  # Signaling Server (Backend)
  - type: web
    name: codersmeet-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3040

  # Frontend (Client) - Optional if using Vercel, but good to have on Render too
  - type: web
    name: codersmeet-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_SIGNALING_URL
        fromService:
          name: codersmeet-backend
          type: web
          property: host
